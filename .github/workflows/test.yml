name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Verify fixture freshness, manifest safety, and legacy audit
        run: |
          npm run fixture:update
          npm run manifest:check
          npm run audit:legacy
          git diff --exit-code
      - name: Run tests
        run: npm test
