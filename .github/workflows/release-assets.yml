name: release-assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty for latest release)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish-release-zip:
    name: publish-release-zip
    runs-on: ubuntu-latest
    steps:
      - name: Determine target release tag
        id: target-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TARGET_TAG="${INPUT_TAG}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG=$(gh release view --repo "${GH_REPO}" --json tagName -q .tagName)
          fi
          echo "tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target-tag.outputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag matches manifest version
        env:
          TARGET_TAG: ${{ steps.target-tag.outputs.tag }}
        run: |
          MANIFEST_VER=$(node -p "require('./manifest.json').version")
          EXPECTED_TAG="chrome-delete-facebook-messages-v${MANIFEST_VER}"
          if [ "${TARGET_TAG}" != "${EXPECTED_TAG}" ] && [ "${TARGET_TAG}" != "v${MANIFEST_VER}" ]; then
            echo "❌ Target tag ${TARGET_TAG} does not match manifest.json version ${MANIFEST_VER}"
            exit 1
          fi
          echo "✅ Target tag matches manifest.json version ${MANIFEST_VER}"

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
          npm run package
          cd dist && sha256sum ./*.zip > SHA256SUMS.txt && cd ..

      - name: Publish zip assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ steps.target-tag.outputs.tag }}
        run: |
          echo "Uploading release zip assets to: ${TARGET_TAG}"
          gh release upload --repo "${GH_REPO}" "${TARGET_TAG}" dist/*.zip dist/SHA256SUMS.txt --clobber
