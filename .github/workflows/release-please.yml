name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release tag for asset packaging
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Setup Node.js
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag matches manifest version
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          MANIFEST_VER=$(node -p "require('./manifest.json').version")
          EXPECTED_TAG="chrome-delete-facebook-messages-v${MANIFEST_VER}"
          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ] && [ "${RELEASE_TAG}" != "v${MANIFEST_VER}" ]; then
            echo "❌ Release tag ${RELEASE_TAG} does not match manifest.json version ${MANIFEST_VER}"
            exit 1
          fi
          echo "✅ Release tag matches manifest.json version ${MANIFEST_VER}"

      - name: Build and package extension zip
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          npm ci
          npm run build
          npm run package
          cd dist && sha256sum ./*.zip > SHA256SUMS.txt && cd ..

      - name: Upload release zip assets and checksums
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release upload "${TAG_NAME}" dist/*.zip dist/SHA256SUMS.txt --clobber

      - name: Authenticate to Google Cloud
        id: google-auth
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Validate Chrome Web Store configuration
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          HAS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token != '' }}
        run: |
          MISSING=""
          [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && MISSING="$MISSING GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -z "$GCP_SERVICE_ACCOUNT" ] && MISSING="$MISSING GCP_SERVICE_ACCOUNT"
          [ -z "$CWS_EXTENSION_ID" ] && MISSING="$MISSING CWS_EXTENSION_ID"
          [ -z "$CWS_PUBLISHER_ID" ] && MISSING="$MISSING CWS_PUBLISHER_ID"
          if [ -n "$MISSING" ]; then
            echo "❌ Missing required repository variables:$MISSING"
            echo "Configure them under Repository -> Settings -> Secrets and variables -> Actions -> Variables"
            exit 1
          fi
          if [ "$HAS_ACCESS_TOKEN" != "true" ]; then
            echo "❌ Google Cloud authentication failed: access token is empty"
            exit 1
          fi
          echo "✅ All required Chrome Web Store repository variables and access token are present"

      - name: Publish extension to Chrome Web Store
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          MANIFEST_VER=$(node -p "require('./manifest.json').version")
          node scripts/chrome-web-store-publish.js --zip "dist/chrome-delete-facebook-messages-${MANIFEST_VER}.zip"
